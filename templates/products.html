{% extends "base.html" %}

{% block title %}Products - My Store{% endblock %}

{% block content %}
<h1 class="mb-4">Product Collections</h1>

<div class="row">
    {% for item in collections %}
    <div class="col-md-3">
        <div class="card mb-4 shadow-sm h-100">
            <!-- Clickable Image -->
            <a href="{{ url_for('product_detail', product_id=item.id) }}">
                <img src="{{ url_for('static', filename='images/' + item.image) }}" class="card-img-top" alt="{{ item.name }}">
            </a>
            
            <div class="card-body d-flex flex-column justify-content-between">
                <div>
                    <!-- Clickable Title -->
                    <h5 class="card-title">
                        <a href="{{ url_for('product_detail', product_id=item.id) }}" class="text-decoration-none text-dark">
                            {{ item.name }}
                        </a>
                    </h5>
                    <p class="card-text fw-bold">${{ item.price }}</p>
                </div>
                
                <div class="mt-3">
                    <a href="{{ url_for('product_detail', product_id=item.id) }}" class="btn btn-outline-primary btn-sm mb-2 w-100">View Details</a>
                    <a href="#" class="btn btn-primary w-100">Add to Cart</a>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
